      - /c/Users/torzh/.aspnet/https:/https:ro
    
  account:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  stripe-gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
