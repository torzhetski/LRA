services:
  client-gateway:
    build:
      context: .
      dockerfile: LRA.Gateways/ClientGateway/Dockerfile
    container_name: client-gateway
    ports:
      - "5001:8080"
      - "7001:8081"

  stripe-gateway:
    build:
      context: .
      dockerfile: LRA.Gateways/StripeGateway/Dockerfile
    container_name: stripe-gateway
    ports:
      - "5002:8080"
      - "7002:8081"
    depends_on:
      - rabbitmq
    
  account:
    build:
      context: .
      dockerfile: LRA.Services/Account/Presentation/Dockerfile
    container_name: account
    depends_on:
      - account-db
      - rabbitmq

  auth:
    build:
      context: .
      dockerfile: LRA.Services/Auth/Presentation/Dockerfile
    container_name: auth
    depends_on:
      - auth-db
      - rabbitmq

  email:
    build:
      context: .
      dockerfile: LRA.Services/Email/SmtpService/Dockerfile
    container_name: email
    depends_on:
      - rabbitmq
   
  subscription:
    build:
      context: .
      dockerfile: LRA.Services/Subscription/Presentation/Dockerfile
    container_name: subscription
    depends_on:
      - subscription-db
      - rabbitmq

  account-db:
     image: postgres:16
     container_name: account-db
     environment:
       POSTGRES_DB: accountdb
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: postgres
     ports:
       - "5433:5432"
     volumes:
      - account-db-data:/var/lib/postgresql/data

  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  subscription-db:
    image: postgres:16
    container_name: subscription-db
    environment:
      POSTGRES_DB: subscriptiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - subscription-db-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  account-db-data:
  auth-db-data:
  subscription-db-data:
  rabbitmq-data:
    