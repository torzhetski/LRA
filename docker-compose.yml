services:
  client-gateway:
    build:
      context: .
      dockerfile: LRA.Gateways/ClientGateway/Dockerfile
    container_name: client-gateway
    ports:
      - "5001:8080"
      - "7001:8081"

  stripe-gateway:
    build:
      context: .
      dockerfile: LRA.Gateways/StripeGateway/Dockerfile
    container_name: stripe-gateway
    ports:
      - "5002:8080"
      - "7002:8081"
    depends_on:
      - rabbitmq
    
  account:
    build:
      context: .
      dockerfile: LRA.Services/Account/Presentation/Dockerfile
    container_name: account
    depends_on:
      - account-db
      - rabbitmq

  email:
    build:
      context: .
      dockerfile: LRA.Services/Email/SmtpService/Dockerfile
    container_name: email
    depends_on:
      - rabbitmq
   
  subscription:
    build:
      context: .
      dockerfile: LRA.Services/Subscription/Presentation/Dockerfile
    container_name: subscription
    depends_on:
      - subscription-db
      - rabbitmq

  account-db:
     image: postgres:16
     container_name: account-db
     environment:
       POSTGRES_DB: accountdb
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: postgres
     volumes:
      - account-db-data:/var/lib/postgresql/data

  subscription-db:
    image: postgres:16
    container_name: subscription-db
    environment:
      POSTGRES_DB: subscriptiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - subscription-db-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db/keycloakdb
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_STRICT: false
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db

  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloakdb
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

volumes:
  account-db-data:
  subscription-db-data:
  rabbitmq-data:
  keycloak-db-data:
